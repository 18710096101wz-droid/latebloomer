<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intraday Quant Radar</title><style>body{margin:0;background:#0b0d10;color:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:1100px;margin:auto;padding:16px}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.c,.p{background:#12161b;border:1px solid #27303a;border-radius:14px;padding:14px}.n{font-weight:700}.v{font-size:24px;font-weight:800;margin:6px 0}.up{color:#2bd67b}.dn{color:#ff5b69}.m{color:#87919d;font-size:12px}.p{margin-top:12px}.score{font-size:52px;font-weight:800}.row{display:flex;gap:16px;flex-wrap:wrap}.flag{background:#171c22;border-left:3px solid #ffbf4b;padding:9px;margin-top:8px;border-radius:7px}@media(max-width:700px){.g{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="w"><h2 style="margin-bottom:4px">Intraday Quant Radar</h2><div class="m">QQQ｜SOXX｜10Y｜META｜INTC · 10秒刷新</div><div id="status" class="m">连接中…</div><div class="g" id="cards"></div><div class="p"><div class="m">MARKET RISK SCORE</div><div class="score" id="score">--</div><b id="regime">等待数据</b><div class="row" style="margin-top:12px"><span>10Y <b id="y">--</b></span><span>META vs QQQ <b id="mr">--</b></span><span>INTC vs SOXX <b id="ir">--</b></span></div><div id="flags"></div></div></div><script>const O=['QQQ','SOXX','TNX','META','INTC'];const pc=x=>Number.isFinite(x)?(x>=0?'+':'')+x.toFixed(2)+'%':'--';const cl=x=>x>=0?'up':'dn';async function load(){try{let r=await fetch('/api/market?t='+Date.now(),{cache:'no-store'}),j=await r.json();if(!j.ok)throw Error(j.error);cards.innerHTML='';O.forEach(k=>{let x=j.data[k],e=document.createElement('div');e.className='c';e.innerHTML='<div class=n>'+x.label+'</div><div class=v>'+x.price.toFixed(2)+'</div><b class='+cl(x.changePct)+'>'+pc(x.changePct)+'</b><div class=m>5m '+pc(x.mom5)+' · 15m '+pc(x.mom15)+' · VWAP '+pc(x.vwapDist)+'</div>';cards.appendChild(e)});score.textContent=j.quant.score;regime.textContent=j.quant.regime;y.textContent=(j.quant.tnxBp>=0?'+':'')+j.quant.tnxBp.toFixed(1)+'bp';mr.textContent=pc(j.quant.metaRS);ir.textContent=pc(j.quant.intcRS);flags.innerHTML=(j.quant.flags.length?j.quant.flags:['暂无明显背离']).map(x=>'<div class=flag>'+x+'</div>').join('');status.textContent='行情时间 '+new Date(j.marketTime*1000).toLocaleTimeString()+' · 页面刷新 '+new Date().toLocaleTimeString()}catch(e){status.textContent='数据异常：'+e.message}setTimeout(load,10000)}load()</script></body></html>
